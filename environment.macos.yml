name: vinci
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch>=2.2
  - torchvision
  - torchaudio
  - numpy=1.26
  - ffmpeg
  - pillow
  - git-lfs
  - setuptools
  - wheel
  - decord
  - pip:
      - fastapi==0.111.1
      - uvicorn[standard]==0.30.1
      - pydantic>=2,<3
      - sse-starlette==2.1.2
      - oss2==2.18.6
      - transformers>=4.41
      - gradio==4.38.1
      - decord==0.6.0
      - omegaconf==2.3.0
      - diffusers==0.29.2
      - accelerate==0.32.1
      - safetensors>=0.4.3
      - einops==0.8.0
      - opencv-python==4.10.0.84
      - imageio
      - matplotlib
      - requests
      - aiohttp
      - sentencepiece
      - protobuf<5
